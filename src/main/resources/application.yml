server:
  port: 8080

spring:
  application:
    name: session2-sample
  datasource:
    url: jdbc:mysql://localhost:3306/session2db
    username: root
    password: root1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
